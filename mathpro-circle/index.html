<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원의 성질 · 풀이 영상 노트</title>
<style>
@font-face{font-family:Gaegu;src:url(fonts/Gaegu-Regular.woff2);font-weight:400}
@font-face{font-family:Gaegu;src:url(fonts/Gaegu-Bold.woff2);font-weight:700}
:root{--blue:#2563eb;--red:#e11d48;--orange:#ea7a14;--ink:#1f2a44;--line:#cfe0f5;--paper:#fffdf6}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Gaegu,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);font-size:20px;
 background:var(--paper) repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);min-height:100vh}
body:before{content:"";position:fixed;left:44px;top:0;bottom:0;width:2px;background:#f4a6a6;opacity:.7;z-index:0}
main{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:16px 16px 48px 60px}
h1{font-size:34px;margin:6px 0 2px;color:var(--blue)} .sub{font-size:18px;opacity:.75;margin-bottom:14px}
.legend{font-size:17px;margin:6px 0 18px;display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:16px;height:16px;border-radius:5px;display:inline-block}
.sec{margin:26px 0 6px;font-size:22px;font-weight:700;color:var(--orange)}
.page{background:#fff;border:2px solid #e3e8f2;border-radius:16px;padding:12px 14px;margin:12px 0;box-shadow:2px 3px 0 #e3e8f2}
.page h3{margin:0 0 8px;font-size:24px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.page h3 small{font-size:17px;font-weight:400;opacity:.65}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,.btn{font-family:inherit;font-size:21px;border:none;cursor:pointer;border-radius:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.pb{min-width:62px;min-height:54px;padding:4px 10px;background:var(--blue);color:#fff;font-weight:700;box-shadow:0 3px 0 #1d4ed8;flex-direction:column;line-height:1}
.pb .t{font-size:13px;font-weight:400;opacity:.9;margin-top:3px}
.pb:active{transform:translateY(2px);box-shadow:none}
.pb.off,.cb.off{background:#e8eaef;color:#9aa1ae;box-shadow:none;cursor:default}
.cb{min-height:54px;padding:4px 14px;background:var(--orange);color:#fff;font-weight:700;box-shadow:0 3px 0 #c2410c;flex-direction:column;line-height:1.05}
.cb .t{font-size:13px;font-weight:400}
.none{font-size:17px;opacity:.6}
/* player */
#player{display:none}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.back{background:#fff;border:2px solid var(--ink);padding:6px 14px;font-weight:700}
#ptitle{font-size:26px;font-weight:700;margin:0}
#ptitle .kind{color:var(--orange)}

.playcard{width:100%;min-height:230px;padding:18px;border-radius:16px;background:#1f2a44 repeating-linear-gradient(#26324f 0 31px,#2f3c5c 31px 32px);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:26px;box-shadow:0 4px 0 #0f172a}
.playcard .big{width:96px;height:96px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:44px;padding-left:8px}
.playcard .t{font-size:18px;font-weight:400;opacity:.85}
#ov{position:fixed;inset:0;background:#000;z-index:50;display:none;overflow:hidden;touch-action:none}
#ov.on{display:block}
#stage{position:absolute;top:0;left:0;background:#000}
#stage.rot{transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
#stage video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#ctl{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;display:flex;align-items:center;gap:12px;transition:opacity .25s}
#ctl.hide{opacity:0;pointer-events:none}
#ctl button{background:rgba(255,255,255,.15);color:#fff;min-width:58px;height:52px;border-radius:14px;font-size:24px;font-weight:700}
#bar{flex:1;height:36px;display:flex;align-items:center;cursor:pointer}
#bar i{display:block;height:8px;width:100%;background:rgba(255,255,255,.3);border-radius:4px;position:relative}
#bar b{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:4px}
#bar b:after{content:"";position:absolute;right:-11px;top:-7px;width:22px;height:22px;border-radius:50%;background:#fff}
#tm{font-family:system-ui,sans-serif;font-size:15px;min-width:92px;text-align:center}
#x{position:absolute;top:12px;right:14px;background:rgba(0,0,0,.55);color:#fff;width:56px;height:56px;border-radius:50%;font-size:28px;transition:opacity .25s}
#x.hide{opacity:0;pointer-events:none}
#bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100px;height:100px;border-radius:50%;background:rgba(225,29,72,.9);color:#fff;font-size:46px;padding-left:8px;display:none}
#bigplay.on{display:flex}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.pdf{background:var(--red);color:#fff;padding:10px 16px;font-weight:700;box-shadow:0 3px 0 #be123c}
.ref{background:#fff;color:var(--blue);border:2px dashed var(--blue);padding:8px 14px;font-weight:700}
.note{font-size:18px;background:#fff7e6;border-left:5px solid var(--orange);padding:8px 12px;border-radius:8px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.nav button{background:#fff;border:2px solid #c9d3e6;padding:8px 14px}
.nav button[disabled]{opacity:.35}
@media (min-width:700px){body{font-size:22px}.pb{min-width:70px;min-height:60px}}
</style>
</head>
<body>
<main>
 <section id="home">
  <h1>📐 원의 성질</h1>
  <div class="sub" id="booktitle"></div>
  <div class="legend">
   <span><i class="dot" style="background:var(--orange)"></i>개념 설명</span>
   <span><i class="dot" style="background:var(--blue)"></i>풀이 영상 있음</span>
   <span><i class="dot" style="background:#e8eaef"></i>준비 중</span>
  </div>
  <div id="list"></div>
 </section>
 <section id="player">
  <div class="top"><button class="btn back" id="back">← 목록</button><h2 id="ptitle"></h2></div>
  <button class="btn playcard" id="openv"><span class="big">▶</span>영상 보기<span class="t" id="vlen">가로 화면으로 재생돼요</span></button>
  <div class="actions" id="actions"></div>
  <div class="nav"><button id="prev">◀ 이전 영상</button><button id="next">다음 영상 ▶</button></div>
 </section>
</main>

<div id="ov"><div id="stage"><video id="vid" playsinline webkit-playsinline preload="metadata"></video>
 <button class="btn" id="bigplay">▶</button>
 <button class="btn" id="x" aria-label="닫기">✕</button>
 <div id="ctl"><button class="btn" id="pp">❚❚</button><button class="btn" id="rw">↺10</button><div id="bar"><i><b id="fill"></b></i></div><span id="tm">0:00 / 0:00</span><button class="btn" id="fw">10↻</button></div>
</div></div>
<script src="data.js"></script>
<script>
const D=window.APP_DATA, $=s=>document.querySelector(s);
const items={}, order=[];
D.pages.forEach(p=>{
  if(p.concept&&p.concept.ready){const c=Object.assign({kind:'concept',page:p.page},p.concept);items[c.id]=c;order.push(c.id)}
  p.problems.forEach(e=>{const x=Object.assign({kind:'problem',page:p.page},e);items[e.id]=x;if(e.ready)order.push(e.id)});
});
$('#booktitle').textContent=D.book+' · '+D.unit;
const mm=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const lbl=l=>l.replace(/\((\d)\)/,'-($1)');
function home(){
  let h='',last='';
  D.pages.forEach(p=>{
    if(p.section!==last){h+=`<div class="sec">${p.section}. ${p.sectionName}</div>`;last=p.section}
    h+=`<div class="page" id="page${p.page}"><h3>${p.page}쪽 <small>${p.kind}</small></h3><div class="row">`;
    if(p.concept) h+=p.concept.ready?`<a class="btn cb" href="#${p.concept.id}">📘 개념 설명<span class="t">${mm(p.concept.dur)}</span></a>`
                                     :`<button class="cb off" disabled>📘 개념 설명<span class="t">준비 중</span></button>`;
    p.problems.forEach(e=>{h+=e.ready?`<a class="btn pb" href="#${e.id}">${lbl(e.label)}<span class="t">▶ ${mm(e.dur)}</span></a>`
                                   :`<button class="pb off" disabled>${lbl(e.label)}<span class="t">준비 중</span></button>`});
    if(!p.problems.length) h+=`<span class="none">이 쪽은 개념만 있어요</span>`;
    h+='</div></div>';
  });
  $('#list').innerHTML=h;
}
let lastHomeScroll=0;
function route(){
  const id=decodeURIComponent(location.hash.slice(1)), v=$('#vid'); closeV();
  const it=items[id];
  if(!it||!(it.ready)){ v.pause(); v.removeAttribute('src'); v.load();
    $('#player').style.display='none';$('#home').style.display='block';
    const pg=id.match(/^page(\d+)$/); if(pg&&$('#'+id)) $('#'+id).scrollIntoView(); else window.scrollTo(0,lastHomeScroll); return;}
  if($('#home').style.display!=='none') lastHomeScroll=window.scrollY;
  $('#home').style.display='none';$('#player').style.display='block';
  $('#ptitle').innerHTML=it.kind==='concept'?`${it.page}쪽 <span class="kind">개념 설명</span>`:`${it.page}쪽 ${lbl(it.label)}번 풀이`;
  document.title=$('#ptitle').textContent+' · 원의 성질';
  v.src=it.video; v.load(); $('#vlen').textContent=mm(it.dur)+' · 가로 화면으로 재생돼요';
  let a=`<a class="btn pdf" href="${it.pdf}" target="_blank" rel="noopener">📄 풀이노트 PDF</a>`;
  (it.refs||[]).forEach(r=>{a+=`<a class="btn ref" href="#${r.target}">▶ ${r.label}</a>`});
  if(it.kind==='concept'&&it.title) a+=`<div class="note">${it.title}</div>`;
  if(it.refs&&it.refs.length) a+=`<div class="note">이 문제에 쓰인 개념은 위 영상에서 자세히 설명했어요.</div>`;
  $('#actions').innerHTML=a;
  const i=order.indexOf(id);
  $('#prev').disabled=i<=0; $('#next').disabled=i>=order.length-1;
  $('#prev').onclick=()=>{if(i>0)location.hash=order[i-1]};
  $('#next').onclick=()=>{if(i<order.length-1)location.hash=order[i+1]};
  window.scrollTo(0,0);
}
$('#back').onclick=()=>{location.hash='page'+(items[decodeURIComponent(location.hash.slice(1))]||{}).page};

/* ---- landscape-only player ---- */
const ov=$('#ov'),st=$('#stage'),V=$('#vid');let hideT=0;
function layout(){const W=window.innerWidth,H=window.innerHeight,portrait=H>W;
  st.classList.toggle('rot',portrait);
  st.style.width=(portrait?H:W)+'px'; st.style.height=(portrait?W:H)+'px';}
function showCtl(){$('#ctl').classList.remove('hide');$('#x').classList.remove('hide');clearTimeout(hideT);
  if(!V.paused) hideT=setTimeout(()=>{$('#ctl').classList.add('hide');$('#x').classList.add('hide')},3000);}
async function openV(){ov.classList.add('on');document.body.style.overflow='hidden';layout();
  try{ if(ov.requestFullscreen) await ov.requestFullscreen({navigationUI:'hide'}); else if(ov.webkitRequestFullscreen) ov.webkitRequestFullscreen(); }catch(e){}
  try{ if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(e){}
  layout(); V.play().catch(()=>{}); showCtl();}
function closeV(){ if(!ov.classList.contains('on')) return; V.pause(); ov.classList.remove('on');document.body.style.overflow='';
  try{ if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){} }
$('#openv').onclick=openV; $('#x').onclick=e=>{e.stopPropagation();closeV()};
$('#pp').onclick=e=>{e.stopPropagation();V.paused?V.play():V.pause()};
$('#bigplay').onclick=e=>{e.stopPropagation();V.play()};
$('#rw').onclick=e=>{e.stopPropagation();V.currentTime=Math.max(0,V.currentTime-10);showCtl()};
$('#fw').onclick=e=>{e.stopPropagation();V.currentTime=Math.min(V.duration||0,V.currentTime+10);showCtl()};
st.addEventListener('click',()=>{ if($('#ctl').classList.contains('hide')) showCtl(); else if(!V.paused){$('#ctl').classList.add('hide');$('#x').classList.add('hide')} });
function seekAt(ev){const b=$('#bar').getBoundingClientRect(),rot=st.classList.contains('rot');
  const f=rot?(ev.clientY-b.top)/b.height:(ev.clientX-b.left)/b.width;
  if(V.duration) V.currentTime=Math.min(1,Math.max(0,f))*V.duration; showCtl();}
let drag=false;const bar=$('#bar');
bar.addEventListener('pointerdown',e=>{e.stopPropagation();drag=true;bar.setPointerCapture(e.pointerId);seekAt(e)});
bar.addEventListener('pointermove',e=>{if(drag)seekAt(e)});
bar.addEventListener('pointerup',()=>{drag=false});
bar.addEventListener('click',e=>e.stopPropagation());
const upd=()=>{const d=V.duration||0;$('#fill').style.width=(d?V.currentTime/d*100:0)+'%';$('#tm').textContent=mm(V.currentTime||0)+' / '+mm(d)};
V.addEventListener('timeupdate',upd);V.addEventListener('loadedmetadata',upd);
V.addEventListener('play',()=>{$('#pp').textContent='❚❚';$('#bigplay').classList.remove('on');showCtl()});
V.addEventListener('pause',()=>{$('#pp').textContent='▶';$('#bigplay').classList.add('on');showCtl()});
window.addEventListener('resize',()=>{if(ov.classList.contains('on'))layout()});
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement&&ov.classList.contains('on')) layout(); });
home(); window.addEventListener('hashchange',route); route();
</script>
</body>
</html>
