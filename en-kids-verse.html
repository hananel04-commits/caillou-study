.rep{position:absolute;left:6px;right:6px;bottom:6px;z-index:5;display:none;align-items:center;gap:8px;background:rgba(255,255,255,.93);border-radius:12px;padding:5px 10px;box-shadow:0 1px 6px rgba(0,0,0,.28);pointer-events:none;min-width:0}
.rep.show{display:flex}
.rep .rn{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;color:#14171a;white-space:nowrap}

.rep .rd i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);box-sizing:border-box;background:#fff;flex:none}
.rep .rd i.on{background:var(--accent)}
.rep .rd i.cur{background:var(--accent-soft)}
.rep.playing .rd i.cur{animation:dotp 1s ease-in-out infinite}
.rep .bar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.rep .bar u{display:block;height:100%;background:var(--accent);text-decoration:none}
.rep .rp{font-weight:800;font-size:14px;color:var(--accent);white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.rep.pulse{animation:repflash .7s ease-out}
@keyframes repflash{0%{background:var(--accent);transform:scale(1.04)}100%{background:rgba(255,255,255,.93);transform:scale(1)}}
@keyframes dotp{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.rep.pulse .rn,.rep.pulse .rp{animation:repflashtx .7s ease-out}
@keyframes repflashtx{0%{color:#fff}100%{}}
@media (prefers-reduced-motion:reduce){.rep.pulse,.rep.pulse .rn,.rep.pulse .rp,.rep.playing .rd i.cur{animation:none}}

.unav{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}

// ---------- fit: big Korean meaning on top, English (+Hangul) below, picture gets the rest ----------
let fitHdr=-1;
function fit(){
  const card=$("card"),bar=document.querySelector(".bar"),il=$("il"),pic=$("pic"),B=document.body;
  if(!card.offsetParent) return;
  const W0=innerWidth, vw=Math.min(W0,560);

  B.classList.remove("squeeze"); card.classList.remove("nohan"); if(!opt.han) card.classList.add("nohan");
  const kBase=Math.round(Math.min(28,Math.max(22,vw*0.068))), eBase=Math.round(Math.min(32,Math.max(24,vw*0.076)));
  let kf=kBase, ef=eBase; const setK=()=>card.style.setProperty("--kfs",kf+"px"), setE=()=>card.style.setProperty("--efs",ef+"px");
  setK(); setE();
  // The picture is ALWAYS the full card width, 1:1 (CSS). Only the English text may shrink (never below 22px / Hangul kept) so that
  // English + nav buttons + picture fit together above the bottom bar; the Korean meaning/header may scroll out instead.
  const span=()=>pic.getBoundingClientRect().bottom-il.getBoundingClientRect().top+6;
  const need=()=>span()>view();
  const wide=()=>{const R=il.getBoundingClientRect();return [...il.querySelectorAll(".col")].some(c=>c.getBoundingClientRect().right>R.right+0.5)||document.documentElement.scrollWidth>W0};
  let guard=0;

  const all=()=>pic.getBoundingClientRect().bottom-card.getBoundingClientRect().top+6>view();
  while(all()&&(ef>26||kf>22)&&guard++<120){ if(ef>26){ef--;setE();} else {kf--;setK();} }
  // 2) still too tall: keep at least English + buttons + picture visible (English may go down to 22px); the label/meaning scroll out
  while((need()||wide())&&ef>22&&guard++<200){ef--;setE();}
  if(wide()){ card.classList.add("nohan"); ef=Math.min(eBase,28); setE(); while(wide()&&ef>16&&guard++<160){ef--;setE();} }
  const side=Math.round(pic.getBoundingClientRect().width);

// ---------- ONE playback controller ----------
// Single persistent <audio> (unlocked by the first Play tap). Every async step carries the run-token it was started with;
// cancelAll() bumps the token, resolves/clears every pending timer/promise and silences the audio, so a stale callback can never act.
const A=new Audio(); A.preload="auto";

const cancelFns=new Set();
const dbg=o=>{ if(window.__log) window.__log.push(o); };
function killAudio(){ A.onended=A.onerror=null; try{A.pause()}catch(e){} try{A.currentTime=0}catch(e){} }

function sleep(ms,tok){return new Promise(res=>{ if(tok!==runTok) return res(); let t; const f=()=>{clearTimeout(t);cancelFns.delete(f);res()}; t=setTimeout(f,ms); cancelFns.add(f); })}

  const fin=()=>{clearTimeout(to);cancelFns.delete(fin);A.onended=A.onerror=null;res()};
  cancelFns.add(fin); to=setTimeout(fin,14000);
  A.onended=()=>{ if(tok===runTok) fin(); };
  A.onerror=()=>{ if(tok===runTok){ $("status").textContent="소리 파일을 불러오지 못했어요."; fin(); } };
  dbg({ev:"speak",url,rate:rate||1}); A.src=url; A.preservesPitch=true; A.webkitPreservesPitch=true; A.defaultPlaybackRate=A.playbackRate=rate||1;
  const p=A.play();
  if(p&&p.catch) p.catch(err=>{ if(tok!==runTok) return; $("status").textContent="소리를 켤 수 없어요. ▶ 버튼을 다시 눌러 주세요."; fin(); if(err&&err.name==="NotAllowedError"&&playing) stop(); });
})}
const warmed=new Set();
function warm(url){ if(warmed.has(url)||!window.fetch) return; warmed.add(url); try{fetch(url,{cache:"force-cache"}).catch(()=>{})}catch(e){} }
function preload(){ wordsList.forEach(w=>warm(w.url)); chunkItems(cur).forEach(c=>warm(c.url)); } // cache warm-up only (no Audio objects, never plays)

// ---------- YouTube player (slow / fast steps) ----------
// YouTube draws its own centre ⏸ button (+ title / logo) briefly after every play start or seekTo(...,true) -- even with controls=0 (measured ~0.3 s at this size).
// So: (1) the iframe is taller than the picture and clipped (title/logo fall into the cropped margins), (2) taps never reach it (pointer-events:none),
// (3) while that overlay may be visible the still picture simply stays on top of the video -- but the SOUND never waits for it:
// every repetition starts as fast as the player can seek (seekTo(start,true) + unmute the moment the play-head reaches the start),
// and the picture switches to the live video only when ICON_MS have passed since playback resumed after the last seek.
// The next video step is primed (hidden, muted, playing near its start) during the LAST repetition of the previous step, so its data is already loaded.
// Between repetitions the player is never paused: it is muted at the end of the sentence and immediately seeked back (short gap, no loading wait).
const REVEAL=false, ICON_MS=4400, LEAD=0.10, SEEKW=450;   // measured with real YouTube: after every seek/unmute the player's centre play/pause controls stay up for ~4.0-4.4 s (they auto-hide), so a live video could only be shown after that. The video is a slideshow of exactly the still pictures (pixel diff ~0), so REVEAL=false keeps the still on screen: no overlay/title/logo can ever show, and the SOUND never waits for anything
let yt=null,ytReady=false,poll=null,primed=false,vidWanted=false,vw=null,vph="",vloadN=0,pulseT=0;
(function(){const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s);})();
window.onYouTubeIframeAPIReady=function(){
  yt=new YT.Player("ytPlayer",{width:"100%",height:"100%",videoId:(ytVid=vidOf(cur)),playerVars:{playsinline:1,rel:0,modestbranding:1,controls:0,disablekb:1,fs:0,iv_load_policy:3,cc_load_policy:0,start:Math.floor(S[cur].st)},
    events:{onReady:()=>{ytReady=true;window.__ytReady=true;try{yt.mute();if(!vidWanted&&!playing)yt.playVideo()}catch(e){}   /* muted warm-up: starts loading the video now, the state handler below pauses it again at once */ const f=document.querySelector("#pic iframe"); if(f){f.tabIndex=-1;f.setAttribute("aria-hidden","true");f.style.pointerEvents="none"}},
      onStateChange:e=>{ if(e.data===1&&!vidWanted) ytIdle(); },   // never let the video keep playing (or make sound) outside a video step
      onError:e=>{$("status").textContent="영상을 재생할 수 없어요 (YouTube 오류 "+e.data+")."}}});
};
function ytIdle(){ vidWanted=false; vw=null; vph=""; clearInterval(poll); setVid(false); try{ if(ytReady){yt.mute();yt.pauseVideo();} }catch(e){} }
function ytMuted(){ try{ if(ytReady&&!yt.isMuted()) yt.mute(); }catch(e){} }
function primeYt(){ if(primed||!ytReady) return; primed=true; try{yt.mute();yt.playVideo();setTimeout(()=>{if(!vidWanted) ytIdle()},500)}catch(e){} }
function prewarm(i,rate){ // hidden + muted: start playing just before the sentence so the data is loaded when the step begins
  if(!ytReady||(vw&&vw.i===i)) return; vidWanted=true; vw={i}; const s=S[i];
  try{yt.mute();yt.setPlaybackRate(rate);ytSeek(i,Math.max(0,s.st-0.6*rate));yt.playVideo();}catch(e){}
}
function maybePrewarm(){ // called at the START of the last repetition of step 1/2 (the first word of step 1 is the last group): a video step is next
  const st=P.step; if(st>1) return;
  const last = st===0 ? (P.u===wordsList.length-1&&P.r===0) : (P.u===0&&P.r===cnts[1]-1);
  if(!last) return;
  const k=nextStepIdx(st); if(k>=2) prewarm(cur,k===2?+opt.rate:1);

// ---- repetition UI (counter + dots + state text), video steps only
function vidB2(){
  const sp=P.step===2?`${opt.rate}배속`:"원래 속도";
  const t=!playing?"":vph==="play"?"재생 중":vph==="next"?(P.r>0?"다음 반복…":"곧 시작…"):vph==="load"?`영상 불러오는 중… (${vloadN}초)`:"";
  return t?`${t} · ${sp}`:`${sp} · 영상 소리`;
}
function renderPill(){
  const el=$("rep"); if(!el) return; const vs=P.step===2||P.step===3;
  el.classList.toggle("show",vs); if(!vs){ el.classList.remove("playing","pulse"); return; }
  const n=cnts[P.step], dn=Math.min(P.r,n), c=Math.min(P.r+1,n);
  const txt=!playing?"":vph==="play"?"재생 중":vph==="next"?(P.r>0?"다음 반복…":"곧 시작…"):vph==="load"?`불러오는 중… ${vloadN}초`:"";
  let mid;
  if(n<=10){ let d=""; for(let k=0;k<n;k++) d+=`<i class="${k<dn?"on":(k===dn&&playing?"cur":"")}"></i>`; mid=`<span class="rd">${d}</span>`; }
  else mid=`<span class="bar"><u style="width:${dn/n*100}%"></u></span>`;
  el.classList.toggle("playing",playing&&vph==="play");
  el.setAttribute("aria-label",`${NAMES[P.step]} ${n}회 중 ${dn}회 끝`);
  el.innerHTML=`<span class="rn"><b>${c}/${n}</b>회</span>${mid}${txt?`<span class="rp">${txt}</span>`:""}`;
}
function setPhase(p){ if(vph===p) return; vph=p; if(P.step===2||P.step===3){ $("b2").textContent=vidB2(); $("b2").classList.toggle("live",playing&&!!vph); renderPill(); } }
function pulseRep(){ const el=$("rep"); if(!el) return; el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); clearTimeout(pulseT); pulseT=setTimeout(()=>el.classList.remove("pulse"),750); }
// one repetition of the sentence. gapMs = pause before the sound starts again (measured from this call). Resolves exactly once.
function playSeg(i,rate,tok,gapMs){return new Promise(res=>{
  if(tok!==runTok) return res();
  gapMs=gapMs||0;
  const s=S[i], t0=Date.now(), gapEnd=t0+gapMs, seekDue=t0+Math.max(0,gapMs-SEEKW);
  let armed=false,done=false,w=null,seekAt=0,lastPlay=0,lastT=-1,lastMove=t0,reseekAt=0,p1At=0,lastAt=0,armAt=0;
  const finish=()=>{ if(done)return; done=true; clearInterval(poll); clearInterval(w); cancelFns.delete(finish); setVid(false); try{yt.mute()}catch(e){} vph="next"; res(); };   // NOT paused: hidden + muted, repositioned for the next repetition
  cancelFns.add(finish); vidWanted=true;
  const doSeek=(from)=>{ const now=Date.now(); try{ yt.mute(); yt.setPlaybackRate(rate); ytSeek(i,Math.max(0,s.st-LEAD*rate)); }catch(e){} seekAt=now; lastMove=now; lastT=-1; lastAt=0; p1At=0; setVid(false);
    try{ const ps=yt.getPlayerState(); if(ps!==1&&ps!==3){ yt.playVideo(); lastPlay=now; } }catch(e){} dbg({ev:"vseek",i,from,r:P.r}); };
  const begin=()=>{
    setPhase("next"); setVid(false);
    clearInterval(poll);
    if(Date.now()>=seekDue) doSeek("start");   // inside the tap handler when possible (autoplay rules)
    poll=setInterval(()=>{ if(tok!==runTok||done){finish();return}
      let t=0,ps=-1; try{t=yt.getCurrentTime();ps=yt.getPlayerState()}catch(e){return}
      const now=Date.now();
      if(!seekAt){ if(now<seekDue) return; doSeek("start"); return; }
      const moving=Math.abs(t-lastT)>0.001&&ps===1; if(moving) lastMove=now; if(ps===1&&lastT>=0&&lastAt&&Math.abs(t-(lastT+(now-lastAt)/1000*rate))>0.3) p1At=now; lastT=t; lastAt=now; if(ps===1&&!p1At&&now-seekAt>=150) p1At=now;   // playback has resumed after the seek (overlay may flash now)
      if(!armed){
        const waited=now-Math.max(t0,gapEnd);
        if(ps===1&&now>=gapEnd&&now-seekAt>=60&&t>=s.st-0.05&&t<=s.st+0.6){ armed=true; armAt=now; try{yt.setPlaybackRate(rate);yt.unMute()}catch(e){} setPhase("play"); pulseRep(); $("status").textContent=""; dbg({ev:"vstart",i,r:P.r,t}); }
        else if(ps===1&&t>s.st+0.6&&now-seekAt>250){ doSeek("overshoot"); }          // gap was longer than seek+lead: go back
        else if(ps!==1&&ps!==3&&now-seekAt>200&&now-lastPlay>700){ try{ yt.mute(); yt.playVideo(); }catch(e){} lastPlay=now; p1At=0; }
        else if(now-lastMove>1600&&now-reseekAt>1600){ reseekAt=now; doSeek("stall"); }
        if(waited>1400){ vloadN=Math.ceil(waited/1000); setPhase("load"); if(vph==="load"){ $("b2").textContent=vidB2(); renderPill(); } }
        if(now-t0>12000){$("status").textContent="영상이 시작되지 않았어요. ▶를 다시 눌러 주세요.";finish()}
        return; }
      // armed: audible. Show the live video only once YouTube's overlay can no longer be on screen.
      setVid(REVEAL&&ps===1&&p1At>0&&now-Math.max(p1At,armAt)>=ICON_MS);
      if(t>=s.et||ps===0){ finish(); return; }
      if(now-lastMove>1500){ if(vph!=="load"){ vloadN=1; } else vloadN=Math.ceil((now-lastMove)/1000); setPhase("load"); $("b2").textContent=vidB2(); renderPill();
        if(now-reseekAt>2500){ reseekAt=now; p1At=0; setVid(false); try{ ytSeek(i,Math.max(t,s.st-0.05)); yt.playVideo(); }catch(e){} lastMove=now-1000; } }
      else if(vph==="load") setPhase("play");
    },40);
  };
  if(ytReady) begin();
  else{ $("status").textContent="영상 플레이어를 기다리는 중…"; w=setInterval(()=>{ if(tok!==runTok||done){clearInterval(w);return} if(ytReady){clearInterval(w);$("status").textContent="";begin()} },300); }
})}

// ---------- the 4-step engine ----------
const gap=()=>+opt.gap*1000, vgap=()=>Math.max(200,Math.min(900,+opt.gap*700));   // video steps: short pause between repetitions
async function run(tok){
  const live=()=>playing&&tok===runTok;
  preload();
  while(live()){
    skipEmpty();
    if(P.step>=4){ finishSentence(); if(!live()) return; await sleep(500,tok); if(!live()) return; continue; }
    renderStep(); scrollIfNew();
    const st=P.step, n=cnts[st];
    if(st<2){ ytMuted(); maybePrewarm(); }
    if(st===0){
      const it=wordsList[P.u]; if(!it){P.step=1;P.u=0;P.r=0;continue}
      showCap(it,true); dbg({ev:"item",step:0,u:P.u,r:P.r,k:it.k,url:it.url});
      await speak(it.url,tok); if(!live()) return;
      await sleep(gap()*0.8,tok); if(!live()) return;
      P.r++; if(P.r>=n){P.r=0;P.u++; if(P.u>=wordsList.length){hideCap();P.step=1;P.u=0;P.r=0;await sleep(500,tok);} }
    } else if(st===1){
      hideCap();
      const items=chunkItems(cur), it=items[P.u]; dbg({ev:"item",step:1,u:P.u,r:P.r,url:it.url,text:it.text});
      await speak(it.url,tok,CHUNK_RATE); if(!live()) return;
      P.u++; if(P.u>=items.length){P.u=0;P.r++; await sleep(P.r>=n?150:gap()*1.3,tok); if(!live()) return; if(P.r>=n){P.step=2;P.r=0;P.u=0;}}
      else { await sleep(400,tok); if(!live()) return; }
    } else {
      hideCap(); dbg({ev:"item",step:st,r:P.r});
      await playSeg(cur,st===2?+opt.rate:1,tok,P.r>0?vgap():(st===3?250:0)); if(!live()) return;
      P.r++; if(P.r>=n){P.step=st+1;P.r=0;P.u=0;} else renderStep();   // dots fill the moment a repetition has finished
    }
    if(!live()) return;
  }
}
function finishSentence(){
  ytIdle();
  done.add(S[cur].n); store.set("done",[...done]); renderRows(); renderBooksOnly();
  if(opt.auto&&cur<S.length-1){ cur++; store.set("cur",cur); resetP(0); const b=S[cur].b!==S[cur-1].b; render(); $("status").textContent=b?`${BN(S[cur].b)} 시작!`:""; preload(); }
  else { playing=false; renderStep(); $("status").textContent=cur>=S.length-1?"마지막 문장까지 모두 끝났어요! 🎉":"이 문장을 모두 읽었어요."; }
}
function renderBooksOnly(){const t=$("books");const sl=t.scrollLeft;render_books_keep(sl)}
function render_books_keep(sl){ $("books").innerHTML=BOOKS.map(b=>{const n=S.filter(x=>x.b===b.n),k=n.filter(x=>done.has(x.n)).length;return `<button type="button" data-b="${b.n}" aria-pressed="${b.n===S[cur].b}">${BN(b.n)}<span class="c">${k===n.length?"✓":k+"/"+n.length}</span></button>`}).join(""); $("books").scrollLeft=sl; }
function start(){ if(playing) return; if(P.step>=4) resetP(0); skipEmpty(); if(P.step>=4){$("status").textContent="설정에서 횟수를 1 이상으로 해 주세요.";return}
  cancelAll(); playing=true; $("status").textContent=""; primeYt(); renderStep(); lastPos=cur+":"+P.step; scrollCard(); run(++runTok); }
function stop(){ playing=false; cancelAll(); ytIdle(); hideCap(); renderStep(); }
function go(i,keepPlaying){ const was=playing; stop(); if(i<0||i>=S.length) return; cur=i; store.set("cur",cur); resetP(0); $("status").textContent=""; render(); history.replaceState(null,"","#"+S[cur].n); if(was||keepPlaying) start(); }
function setStep(k){ const was=playing; stop(); P={step:k,r:0,u:0}; showCur=false; wordsList=sentWords(cur); render(); if(was) start(); }
$("play").onclick=()=>playing?stop():start();
$("prev").onclick=()=>go(cur-1,true);
$("next").onclick=()=>go(cur+1,true);
$("chips").addEventListener("click",e=>{const b=e.target.closest("button[data-s]");if(!b)return;const k=+b.dataset.s;if(cnts[k]===0){$("status").textContent="이 단계는 횟수가 0이에요 (⚙ 설정).";return}setStep(k);});
$("books").addEventListener("click",e=>{const b=e.target.closest("button[data-b]");if(!b)return;const i=S.findIndex(x=>x.b===+b.dataset.b);go(i,playing)});
$("rows").addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;go(+b.dataset.i,true)});

// ---------- previous / next word (chunk) inside the current step ----------
async function preview(tok){ // paused: hear the item we just jumped to, once
  if(P.step===0){const it=wordsList[P.u]; if(!it) return; showCap(it,true); dbg({ev:"item",step:0,u:P.u,r:0,k:it.k,url:it.url,preview:1}); await speak(it.url,tok);}
  else if(P.step===1){const it=chunkItems(cur)[P.u]; if(!it) return; hideCap(); dbg({ev:"item",step:1,u:P.u,r:0,url:it.url,text:it.text,preview:1}); await speak(it.url,tok,CHUNK_RATE);}
}
function navMove(dir){
  if(P.step>=4) return;
  const st=P.step; let np=null;
  if(st===0||st===1){
    const len=st===0?wordsList.length:S[cur].ch.length; let nu=P.u+dir;
    if(nu<0) nu=0;
    if(nu>=len){ const k=nextStepIdx(st); if(k>=0) np={step:k,r:0,u:0}; else nu=len-1; }
    if(!np) np={step:st,r:0,u:nu};
  } else { const k=dir<0?prevStepIdx():nextStepIdx(st); if(k<0) return; np={step:k,r:0,u:0}; }
  const was=playing; cancelAll(); ytIdle(); hideCap(); $("status").textContent="";
  P=np; showCur=true; renderStep();
  if(was){ lastPos=cur+":"+P.step; scrollCard(); run(++runTok); }
  else { preview(++runTok); }
}
$("uprev").onclick=()=>navMove(-1);
$("unext").onclick=()=>navMove(1);

// ---------- tap a word = hear it + see its meaning ----------
function sayWord(k,el){
  if(!W[k]) return; const was=playing; if(was) stop(); else cancelAll();
  document.querySelectorAll(".say").forEach(e=>e.classList.remove("say")); if(el) el.classList.add("say");
  const it={k,url:wUrl(k),han:W[k][0],mean:W[k][1]};
  showCap(it,false); const tok=++runTok;
  speak(it.url,tok).then(()=>{if(el) el.classList.remove("say")});
}
$("il").addEventListener("click",e=>{const c=e.target.closest(".col");if(c)sayWord(c.dataset.w,c)});
$("il").addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const c=e.target.closest(".col");if(c){e.preventDefault();sayWord(c.dataset.w,c)}});
$("ko").onclick=()=>{const c=$("card");if(c.classList.contains("hideko")){c.classList.remove("hideko");setTimeout(()=>{if(opt.hideko)c.classList.add("hideko")},2500)}};

// ---------- settings ----------
function saveOpt(){store.set("rate",opt.rate);store.set("gap",opt.gap);store.set("auto",opt.auto);store.set("dedupe",opt.dedupe);store.set("han",opt.han);store.set("hideko",opt.hideko);store.set("cnt",cnts)}
function syncSettings(){
  document.querySelectorAll(".step").forEach(s=>{s.querySelector("output").textContent=cnts[+s.dataset.k]});
  $("rate").value=opt.rate; $("gap").value=opt.gap;
  [["auto","auto"],["dedupe","dedupe"],["han","han"],["hideko","hideko"]].forEach(([id,k])=>$(id).setAttribute("aria-pressed",String(!!opt[k])));
}
document.querySelectorAll(".step").forEach(s=>s.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const k=+s.dataset.k;cnts[k]=Math.max(0,Math.min(30,cnts[k]+ +b.dataset.d));syncSettings();saveOpt();}));
["auto","dedupe","han","hideko"].forEach(id=>$(id).onclick=()=>{opt[id]=!opt[id];syncSettings();saveOpt();});
$("rate").onchange=()=>{opt.rate=$("rate").value;saveOpt()}; $("gap").onchange=()=>{opt.gap=$("gap").value;saveOpt()};
$("reset").onclick=()=>{cnts=DEF.slice();syncSettings();saveOpt()};
function openSet(){ $("modal").dataset.was=playing?"1":""; stop(); syncSettings(); $("modal").classList.add("show"); }
function closeSet(){ $("modal").classList.remove("show"); const keep=P.step; resetP(0); render(); }
$("gear").onclick=openSet; $("mclose").onclick=closeSet; $("mok").onclick=closeSet;
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeSet()});

// ---------- init ----------
(function(){ const h=location.hash.replace("#",""); if(/^\d{1,3}$/.test(h)){const i=S.findIndex(s=>s.n===+h); if(i>=0) cur=i;} })();
syncSettings(); resetP(0); render();
window.__app={get cur(){return cur},get P(){return P},get playing(){return playing}};
</script>
</html>
