<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>오늘의 성경읽기</title>
<style>
:root{--bg:#F6F4EF;--surface:#fff;--fg:#221F1A;--muted:#6E675C;--line:#E2DCD0;--accent:#9A6B2F;--accent-soft:#F3E8D6}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--surface:#1E1B17;--fg:#EEE8DE;--muted:#A39A8C;--line:#353028;--accent:#D9A660;--accent-soft:#3A2E1D;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:16px 14px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:19px;margin:4px 0 12px}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player>div,.player iframe{position:absolute;inset:0;width:100%;height:100%}
.now{margin:12px 0 10px;font-size:17px;font-weight:600}
.now small{color:var(--muted);font-weight:500;margin-right:6px}
.ctrl{display:flex;gap:10px}
.ctrl button{flex:1;font:inherit;font-size:16px;font-weight:600;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.ctrl button:disabled{opacity:.4}
ol{list-style:none;padding:0;margin:16px 0 0;border-top:1px solid var(--line)}
li button{display:flex;gap:10px;width:100%;text-align:left;font:inherit;font-size:15px;padding:12px 6px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg)}
li button .n{color:var(--muted);min-width:1.6em}
li.on button{background:var(--accent-soft);font-weight:600}
li.on button .n{color:var(--accent)}
.err{color:#B3261E;margin-top:12px}
</style>
<main>
  <h1 id="h">오늘의 성경읽기</h1>
  <div class="player"><div id="yt"></div></div>
  <div class="now" id="now"></div>
  <div class="ctrl">
    <button id="prev" type="button">◀ 이전</button>
    <button id="next" type="button">다음 ▶</button>
  </div>
  <ol id="list"></ol>
  <div class="err" id="err" hidden></div>
</main>
<script>
// Usage: bible.html?ids=ID1.ID2.ID3 (or commas)&t=제목  — plays the YouTube IDs back to back.
var q=new URLSearchParams(location.search);
var ids=(q.get('ids')||'').split(/[,.~|\s]+/).filter(function(s){return /^[\w-]{11}$/.test(s)});
var titles=ids.map(function(id){return id});
var cur=Math.max(0,Math.min(ids.length-1,(parseInt(q.get('i')||'1',10)||1)-1));
var player=null;
var $=function(id){return document.getElementById(id)};
if(q.get('t')){ $('h').textContent=q.get('t'); document.title=q.get('t')+' · 성경읽기'; }
function render(){
  $('now').innerHTML='';
  var s=document.createElement('small'); s.textContent=(cur+1)+' / '+ids.length;
  $('now').appendChild(s); $('now').appendChild(document.createTextNode(titles[cur]||''));
  $('prev').disabled=cur<=0; $('next').disabled=cur>=ids.length-1;
  var ol=$('list'); ol.innerHTML='';
  ids.forEach(function(id,i){
    var li=document.createElement('li'); if(i===cur) li.className='on';
    var b=document.createElement('button'); b.type='button';
    var n=document.createElement('span'); n.className='n'; n.textContent=(i+1)+'.';
    b.appendChild(n); b.appendChild(document.createTextNode(titles[i]));
    b.onclick=function(){go(i)}; li.appendChild(b); ol.appendChild(li);
  });
}
function go(i){ if(i<0||i>=ids.length) return; cur=i; render(); if(player&&player.loadVideoById) player.loadVideoById(ids[cur]); }
$('prev').onclick=function(){go(cur-1)};
$('next').onclick=function(){go(cur+1)};
if(!ids.length){ $('err').hidden=false; $('err').textContent='영상 ID가 없습니다. 주소에 ?ids=ID1,ID2 를 넣어 주세요.'; }
else {
  render();
  ids.forEach(function(id,i){
    fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id))
      .then(function(r){return r.ok?r.json():null}).then(function(d){ if(d&&d.title){ titles[i]=d.title.normalize('NFC'); render(); } }).catch(function(){});
  });
  var tag=document.createElement('script'); tag.src='https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
}
function onYouTubeIframeAPIReady(){
  player=new YT.Player('yt',{videoId:ids[cur],host:'https://www.youtube.com',
    playerVars:{playsinline:1,rel:0,origin:location.origin},
    events:{
      onStateChange:function(e){
        if(e.data===YT.PlayerState.ENDED && cur<ids.length-1) go(cur+1);
        if(e.data===YT.PlayerState.PLAYING){ var d=player.getVideoData&&player.getVideoData(); if(d&&d.title&&titles[cur]===ids[cur]){titles[cur]=d.title; render();} }
      },
      onError:function(e){ $('err').hidden=false; $('err').textContent=(cur+1)+'번 영상을 재생할 수 없습니다 (오류 '+e.data+'). 다음 영상으로 넘어갑니다.'; if(cur<ids.length-1) setTimeout(function(){go(cur+1)},1500); }
    }});
}
</script>
</html>
