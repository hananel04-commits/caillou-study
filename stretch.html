const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function card(d){
 let h=`<div class="title">${d.n}. ${d.star?'<span class="star">★</span> ':''}${e(d.name)}</div><div class="en">${e(d.en)}</div>
 <div class="pic"><img src="${d.img}" alt="${e(d.name)} 그림"><div class="cap">${e(d.view)}</div></div>
 <div class="meta">자세: ${e(d.pos)}</div>
 <div class="sec"><div class="lbl">시작 자세</div>${e(d.start)}</div>
 <div class="sec"><div class="lbl">방법</div><ol>${d.steps.map(s=>`<li>${e(s)}</li>`).join('')}</ol></div>
 <div class="sec"><div class="lbl">호흡·유지</div>${e(d.breath)}</div>`;
 if(d.caution)h+=`<div class="sec caution"><div class="lbl">주의</div>${e(d.caution)}</div>`;
 h+=`<div class="sec"><div class="lbl">효과</div>${e(d.effect)}</div>`;
 h+=`<div class="sec"><div class="lbl">영상에서 보기</div>${d.links.map(l=>`<a class="vbtn" href="${l.url}" target="_blank" rel="noopener">▶ 영상 ${l.v} · ${l.label}부터<span>${e(VN[l.v])}${l.note?'<br>'+e(l.note):''}</span></a>`).join('')}</div>`;
 return h;}
function list(){
 let h='<div class="intro">★ = 2개 이상의 영상에 나오는 동작. 누르면 그 동작으로 갑니다.</div><h2>★ 여러 영상에 나오는 동작</h2>';
 D.forEach(d=>{ if(d.n===17)h+='<h2>한 영상에만 나오는 동작</h2>';
  h+=`<a href="#${d.n}" onclick="go(${d.n});return false" class="${d.n===cur?'cur':''}"><span class="no">${d.n}</span><span>${d.star?'<span class="star">★</span> ':''}${e(d.name)}</span></a>`});
 return h;}
let showList=false;
function render(){
 document.getElementById('cnt').textContent=showList?`전체 목록 (${N})`:`${cur} / ${N}`;
 document.getElementById('card').style.display=showList?'none':'block';
 document.getElementById('lv').style.display=showList?'block':'none';
 document.getElementById('bot').style.display=showList?'none':'flex';
 document.getElementById('tgl').textContent=showList?'닫기':'전체 목록';
 if(showList)document.getElementById('lv').innerHTML=list();
 else{document.getElementById('card').innerHTML=card(D[cur-1]);
  document.getElementById('prev').disabled=cur<=1;document.getElementById('next').disabled=cur>=N;}
 window.scrollTo(0,0);}
function go(n){if(n<1||n>N)return;cur=n;showList=false;history.replaceState(null,'','#'+n);render();}
function toggle(){showList=!showList;history.replaceState(null,'',showList?'#list':'#'+cur);render();}
function fromHash(){const h=location.hash.slice(1);if(h==='list'){showList=true}else{const n=parseInt(h);if(n>=1&&n<=N)cur=n;showList=false}render();}
window.addEventListener('hashchange',fromHash);fromHash();
</script></body></html>
