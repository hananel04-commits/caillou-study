const KP="enKids_";
const $=id=>document.getElementById(id);
const S=DATA.s, W=DATA.words, BOOKS=DATA.books, VID=DATA.video.id;
const store={get(k,d){try{const v=localStorage.getItem(KP+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(KP+k,JSON.stringify(v))}catch(e){}}};
const DEF=[5,5,5,10], NAMES=["단어 읽기","끊어 읽기","천천히 읽기","빠르게 읽기"];
let cnts=store.get("cnt",DEF).map(Number); if(cnts.length!==4||cnts.some(x=>!(x>=0&&x<=30))) cnts=DEF.slice();
let opt={rate:String(store.get("rate","0.75")),gap:String(store.get("gap","0.6")),auto:store.get("auto",true),dedupe:store.get("dedupe",true),han:store.get("han",true),hideko:store.get("hideko",false)};
let done=new Set(store.get("done",[]));
let cur=Math.min(S.length-1,Math.max(0,+store.get("cur",0)||0));
let P={step:0,r:0,u:0};          // r = repetition being played (0-based), u = word / chunk index
let playing=false, runTok=0, wordsList=[], showCur=false;
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function norm(w){return String(w).toLowerCase().replace(/[’]/g,"'").replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,"")}
function bookOf(i){return S[i].b}

// ---------- sentence structure ----------
function wUrl(k){return "kids/w/"+W[k][2]+".mp3"}
function cUrl(c){return "kids/c/"+c[1]+".mp3"}
function sentWords(i){ // unique (or all) words in order. ONE item object feeds highlight + caption + audio: {k, ti(token index), url, han, mean}
  const out=[],seen=new Set(); let ti=0;
  S[i].ch.forEach(c=>c[0].split(/\s+/).forEach(t=>{const k=norm(t); if(k&&W[k]&&!(opt.dedupe&&seen.has(k))){seen.add(k);out.push({k,ti,url:wUrl(k),han:W[k][0],mean:W[k][1]});} ti++;}));
  return out;
}
function chunkItems(i){return S[i].ch.map((c,ci)=>({ci,text:c[0],url:cUrl(c)}))}
function units(step){ // number of units in one repetition
  if(step===0) return wordsList.length; if(step===1) return S[cur].ch.length; return 1;
}
function resetP(step){P={step:step||0,r:0,u:0}; showCur=false; wordsList=sentWords(cur); skipEmpty();}
function skipEmpty(){ while(P.step<4&&cnts[P.step]===0){P.step++;P.r=0;P.u=0;} }
function totalUnits(){return [0,1,2,3].reduce((a,k)=>a+cnts[k]*(k===0?wordsList.length:k===1?S[cur].ch.length:1),0)}
function doneUnits(){let d=0;for(let k=0;k<P.step&&k<4;k++) d+=cnts[k]*(k===0?wordsList.length:k===1?S[cur].ch.length:1);
  if(P.step<4){ if(P.step===0) d+=P.u*cnts[0]+P.r; else if(P.step===1) d+=P.r*S[cur].ch.length+P.u; else d+=P.r;} return d}

// ---------- rendering ----------
function render(){
  const s=S[cur];
  $("books").innerHTML=BOOKS.map(b=>{const n=S.filter(x=>x.b===b.n),k=n.filter(x=>done.has(x.n)).length;return `<button type="button" data-b="${b.n}" aria-pressed="${b.n===s.b}">Book ${b.n}<span class="c">${k===n.length?"✓":k+"/"+n.length}</span></button>`}).join("");
  const on=$("books").querySelector('[aria-pressed="true"]'); if(on){const T=$("books");T.scrollLeft=Math.max(0,on.offsetLeft-T.offsetLeft-10)}
  $("ko").textContent=s.ko;
  let ti=0;
  $("il").innerHTML=s.ch.map((c,ci)=>`<span class="ch" data-c="${ci}">`+c[0].split(/\s+/).map(t=>{const k=norm(t),h=(W[k]||["",""])[0];return `<span class="col" role="button" tabindex="0" data-w="${esc(k)}" data-t="${ti++}"><span class="ie">${esc(t)}</span><span class="ik">${esc(h)}</span></span>`}).join("")+`</span>`).join("");
  $("img").src="kids/img/"+s.img; $("img").alt=s.ko;
  $("badge").textContent=`${s.n} / ${S.length}`; renderWhere();
  $("card").classList.toggle("hideko",!!opt.hideko);
  $("card").classList.toggle("nohan",!opt.han);
  renderRows(); renderStep(); fit();
}
function whereOf(s){const inB=S.filter(x=>x.b===s.b); return {b:s.b,i:inB.findIndex(x=>x.n===s.n)+1,t:inB.length}}
function renderWhere(){const w=whereOf(S[cur]); $("wb").textContent=`Book ${w.b} · ${w.i}/${w.t}문장`; $("wg").textContent=`전체 ${S[cur].n}/${S.length}`;}
function renderStep(){
  const n=cnts;
  $("chips").innerHTML=["①","②","③","④"].map((t,k)=>`<button type="button" class="chip ${P.step===k?"on":P.step>k?"done":""} ${n[k]===0?"zero":""}" data-s="${k}" aria-label="${NAMES[k]} ${n[k]}번">${P.step>k&&n[k]>0?"✓":t}</button>`).join("");
  let b1,b2="";
  if(P.step>=4){ b1=`<b>끝!</b> 4단계 완료 ✓`; b2="다음 문장으로 가 볼까요?"; }
  else{
    const rep=Math.min(P.r+1,n[P.step]);
    b1=`${NAMES[P.step]} <b>${rep}/${n[P.step]}</b>`;
    if(P.step===0){const w=wordsList[Math.min(P.u,wordsList.length-1)]; b2=`단어 ${Math.min(P.u+1,wordsList.length)}/${wordsList.length} · ${w?w.k:""}`}
    else if(P.step===1) b2=`끊어서 · ${Math.min(P.u+1,S[cur].ch.length)}/${S[cur].ch.length} 덩어리`;
    else if(P.step===2) b2=`${opt.rate}배속 · 영상 소리`;
    else b2="원래 속도 · 영상 소리";
  }
  $("b1").innerHTML=b1; $("b2").textContent=b2;
  const tot=totalUnits(), d=doneUnits();
  {const w=whereOf(S[cur]); $("cnt").textContent=`Book ${w.b} · ${w.i}/${w.t}문장 (${S[cur].n}/${S.length})`;}
  $("fill").style.width=(P.step>=4?100:tot?d/tot*100:0)+"%";
  $("play").textContent=playing?"⏸ 멈춤":(P.step>=4?"↻ 다시":(d>0?"▶ 이어서":"▶ 시작"));
  $("play").classList.toggle("on",playing);
  const foc=playing||showCur;
  document.querySelectorAll("#il .ch").forEach((e,i)=>e.classList.toggle("on",foc&&P.step===1&&i===P.u));
  const wi=wordsList[P.u];
  document.querySelectorAll("#il .col").forEach(e=>e.classList.toggle("cur",!!(foc&&P.step===0&&wi&&+e.dataset.t===wi.ti)));
  if(!(playing&&(P.step===2||P.step===3))) setVid(false);   // still picture whenever the video is not actively playing
  renderNav();
}
function prevStepIdx(){for(let k=P.step-1;k>=0;k--) if(cnts[k]>0) return k; return -1}
function nextStepIdx(from){for(let k=from+1;k<4;k++) if(cnts[k]>0) return k; return -1}
function renderNav(){
  const st=P.step, a=$("uprev"), b=$("unext");
  const L=(btn,txt,ar,left)=>{btn.querySelector(".lb").textContent=txt;btn.querySelector(".ar").textContent=ar;btn.setAttribute("aria-label",txt)};
  if(st===0){L(a,"이전 단어","⏮");L(b,"다음 단어","⏭");a.disabled=b.disabled=false}
  else if(st===1){L(a,"이전 끊어읽기","⏮");L(b,"다음 끊어읽기","⏭");a.disabled=b.disabled=false}
  else if(st===2||st===3){L(a,"이전 단계","⏮");L(b,"다음 단계","⏭");a.disabled=prevStepIdx()<0;b.disabled=nextStepIdx(st)<0}
  else {L(a,"이전 단어","⏮");L(b,"다음 단어","⏭");a.disabled=b.disabled=true}
}
function setVid(on){const p=$("pic"); if(p.classList.contains("vid")!==on) p.classList.toggle("vid",on)}
function renderRows(){
  $("listSum").textContent=`문장 목록 · Book ${S[cur].b} · ${S.filter(x=>x.b===S[cur].b).length}문장`;
  $("rows").innerHTML=S.map((s,i)=>s.b!==S[cur].b?"":`<button type="button" data-i="${i}" class="${i===cur?"cur":""}"><span class="n">${s.n}</span><span class="t">${esc(s.en)}<span class="k">${esc(s.ko)}</span></span><span class="ok">${done.has(s.n)?"✓":""}</span></button>`).join("");
}
function showCap(it,sticky){
  if(!it){$("cap").classList.remove("show");return}
  $("cap").innerHTML=`<span class="cw"><b>${esc(it.k)}</b><i>${esc(it.han)}</i></span> <span class="cm">${esc(it.mean)}</span>`; $("cap").classList.add("show");
  clearTimeout(showCap.t); if(!sticky) showCap.t=setTimeout(()=>$("cap").classList.remove("show"),2800);
}

// ---------- fit: big Korean meaning on top, English (+Hangul) below, picture gets the rest ----------
let fitHdr=-1;
function fit(){
  const card=$("card"),bar=document.querySelector(".bar"),il=$("il"),pic=$("pic"),B=document.body;
  if(!card.offsetParent) return;
  const W0=innerWidth, vw=Math.min(W0,560);
  const view=()=>innerHeight-bar.getBoundingClientRect().height-8-CARD_M;      // visible height above the bottom bar
  B.classList.remove("squeeze"); card.classList.remove("nohan"); if(!opt.han) card.classList.add("nohan");
  const kBase=Math.round(Math.min(28,Math.max(22,vw*0.068))), eBase=Math.round(Math.min(32,Math.max(24,vw*0.076)));
  let kf=kBase, ef=eBase; const setK=()=>card.style.setProperty("--kfs",kf+"px"), setE=()=>card.style.setProperty("--efs",ef+"px");
  setK(); setE();
  // The picture is ALWAYS the full card width, 1:1 (CSS). Only the English text may shrink (never below 22px / Hangul kept) so that
  // English + nav buttons + picture fit together above the bottom bar; the Korean meaning/header may scroll out instead.
  const span=()=>pic.getBoundingClientRect().bottom-il.getBoundingClientRect().top+6;
  const need=()=>span()>view();
  const wide=()=>{const R=il.getBoundingClientRect();return [...il.querySelectorAll(".col")].some(c=>c.getBoundingClientRect().right>R.right+0.5)||document.documentElement.scrollWidth>W0};
  let guard=0;
  // 1) prefer to keep the WHOLE card (label, meaning, English, buttons, picture) on screen: shrink English down to 26px, then the Korean meaning down to 22px
  const all=()=>pic.getBoundingClientRect().bottom-card.getBoundingClientRect().top+6>view();
  while(all()&&(ef>26||kf>22)&&guard++<120){ if(ef>26){ef--;setE();} else {kf--;setK();} }
  // 2) still too tall: keep at least English + buttons + picture visible (English may go down to 22px); the label/meaning scroll out
  while((need()||wide())&&ef>22&&guard++<200){ef--;setE();}
  if(wide()){ card.classList.add("nohan"); ef=Math.min(eBase,28); setE(); while(wide()&&ef>16&&guard++<160){ef--;setE();} }
  const side=Math.round(pic.getBoundingClientRect().width);
  card.dataset.fit=`k${kf} e${ef}${card.classList.contains("nohan")&&opt.han?" nohan":""} pic${side}`;
  fitHdr=document.querySelector("header").offsetHeight;
  // make sure the page is tall enough to scroll to the target position
  const y=scrollTarget();
  document.querySelector(".wrap").style.minHeight=Math.ceil(Math.max(y,0)+innerHeight)+"px";
}
// target scroll: card top at viewport top when everything fits; otherwise the picture bottom sits just above the bottom bar
// (English text stays right above the picture; label/step header/meaning scroll out - the fixed bar still shows Book + sentence number)
function scrollTarget(){
  const c=$("card"),pic=$("pic"),bar=document.querySelector(".bar");
  const cardTop=c.getBoundingClientRect().top+scrollY-CARD_M, picBottom=pic.getBoundingClientRect().bottom+scrollY+6;
  const view=innerHeight-bar.getBoundingClientRect().height;
  return Math.max(0,Math.round(Math.max(cardTop, picBottom-view)));
}
// ---------- scroll the practice card to the top of the viewport (play / sentence change / step change) ----------
const CARD_M=4; let lastPos="";
function scrollCard(){
  const c=$("card"); if(!c.offsetParent) return;
  const y=scrollTarget();
  if(Math.abs(y-scrollY)<3) return;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  scrollTo({top:y,behavior:reduce?"auto":"smooth"});
}
function scrollIfNew(){ const k=cur+":"+P.step; if(k!==lastPos){lastPos=k;scrollCard();} }
addEventListener("resize",fit);
if(window.ResizeObserver) new ResizeObserver(()=>{if(document.querySelector("header").offsetHeight!==fitHdr) fit();}).observe(document.querySelector("header"));

// ---------- ONE playback controller ----------
// Single persistent <audio> (unlocked by the first Play tap). Every async step carries the run-token it was started with;
// cancelAll() bumps the token, resolves/clears every pending timer/promise and silences the audio, so a stale callback can never act.
const A=new Audio(); A.preload="auto";
const cancelFns=new Set();
const dbg=o=>{ if(window.__log) window.__log.push(o); };
function killAudio(){ A.onended=A.onerror=null; try{A.pause()}catch(e){} try{A.currentTime=0}catch(e){} }
function cancelAll(){ runTok++; const fs=[...cancelFns]; cancelFns.clear(); fs.forEach(f=>{try{f()}catch(e){}}); killAudio(); }
function sleep(ms,tok){return new Promise(res=>{ if(tok!==runTok) return res(); let t; const f=()=>{clearTimeout(t);cancelFns.delete(f);res()}; t=setTimeout(f,ms); cancelFns.add(f); })}
function speak(url,tok){return new Promise(res=>{
  if(tok!==runTok) return res();
  killAudio(); let to;
  const fin=()=>{clearTimeout(to);cancelFns.delete(fin);A.onended=A.onerror=null;res()};
  cancelFns.add(fin); to=setTimeout(fin,10000);
  A.onended=()=>{ if(tok===runTok) fin(); };
  A.onerror=()=>{ if(tok===runTok){ $("status").textContent="소리 파일을 불러오지 못했어요."; fin(); } };
  dbg({ev:"speak",url}); A.src=url;
  const p=A.play();
  if(p&&p.catch) p.catch(err=>{ if(tok!==runTok) return; $("status").textContent="소리를 켤 수 없어요. ▶ 버튼을 다시 눌러 주세요."; fin(); if(err&&err.name==="NotAllowedError"&&playing) stop(); });
})}
const warmed=new Set();
function warm(url){ if(warmed.has(url)||!window.fetch) return; warmed.add(url); try{fetch(url,{cache:"force-cache"}).catch(()=>{})}catch(e){} }
function preload(){ wordsList.forEach(w=>warm(w.url)); chunkItems(cur).forEach(c=>warm(c.url)); } // cache warm-up only (no Audio objects, never plays)

// ---------- YouTube player (slow / fast steps) ----------
// YouTube draws its own big centre ⏸ button (+ title / logo) for ~4.5 s after every PLAY START or seekTo(...,true) -- even with controls=0.
// So: (1) the iframe is taller than the picture and clipped (title/logo fall into the cropped margins), (2) taps never reach it (pointer-events:none),
// (3) the video stays hidden behind the still picture until its overlay has faded: it is "pre-rolled" muted ~4.8 s before the sentence start
// (during the last chunk repetition) and only revealed + unmuted when the play-head reaches the sentence start, (4) between repetitions it is
// NOT paused: it just goes muted+hidden and is repositioned with seekTo(start,false), which does not re-trigger the overlay.
const PRE=4.8, ICON_MS=4700;
let yt=null,ytReady=false,poll=null,primed=false,vidWanted=false,trig=0,vw=null;
(function(){const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s);})();
window.onYouTubeIframeAPIReady=function(){
  yt=new YT.Player("ytPlayer",{width:"100%",height:"100%",videoId:VID,playerVars:{playsinline:1,rel:0,modestbranding:1,controls:0,disablekb:1,fs:0,iv_load_policy:3,cc_load_policy:0,start:Math.floor(S[cur].st)},
    events:{onReady:()=>{ytReady=true;window.__ytReady=true;try{yt.mute()}catch(e){} const f=document.querySelector("#pic iframe"); if(f){f.tabIndex=-1;f.setAttribute("aria-hidden","true");f.style.pointerEvents="none"}},
      onStateChange:e=>{ if(e.data===1&&!vidWanted) ytIdle(); },   // never let the video keep playing (or make sound) outside a video step
      onError:e=>{$("status").textContent="영상을 재생할 수 없어요 (YouTube 오류 "+e.data+")."}}});
};
function ytIdle(){ vidWanted=false; vw=null; clearInterval(poll); setVid(false); try{ if(ytReady){yt.mute();yt.pauseVideo();} }catch(e){} }
function ytMuted(){ try{ if(ytReady&&!yt.isMuted()) yt.mute(); }catch(e){} }
function primeYt(){ if(primed||!ytReady) return; primed=true; try{yt.mute();yt.playVideo();setTimeout(()=>{if(!vidWanted) ytIdle()},500)}catch(e){} }
function prewarm(i,rate){ // start the (hidden, muted) video ~PRE s before the sentence so YouTube's overlay has faded when we reveal it
  if(!ytReady||(vw&&vw.i===i)) return; vidWanted=true; vw={i}; const s=S[i];
  try{yt.mute();yt.setPlaybackRate(rate);trig=Date.now();yt.seekTo(Math.max(0,s.st-PRE*rate),true);yt.playVideo();}catch(e){}
}
function maybePrewarm(){ // called at the start of the last item of step 1/2: the video step is next
  const st=P.step; if(st>1||P.step>=4) return;
  const lastItem = st===0 ? (P.u===wordsList.length-1&&P.r===cnts[0]-1) : (P.u===0&&P.r===cnts[1]-1);
  if(!lastItem) return;
  const k=nextStepIdx(st); if(k>=2) prewarm(cur,k===2?+opt.rate:1);
}
function playSeg(i,rate,tok){return new Promise(res=>{
  if(tok!==runTok) return res();
  const s=S[i]; let armed=false,done=false,w=null,seekAt=0,seekTries=0,lastPlay=0; const tAll=Date.now(); let tNote=0;
  const finish=()=>{ if(done)return; done=true; clearInterval(poll); clearInterval(w); cancelFns.delete(finish); setVid(false); try{yt.mute()}catch(e){} res(); };   // NOT paused: hidden + muted, repositioned for the next repetition
  cancelFns.add(finish); vidWanted=true;
  const begin=()=>{
    try{ if(!vw||vw.i!==i) prewarm(i,rate); else yt.setPlaybackRate(rate); }catch(e){}
    clearInterval(poll);
    poll=setInterval(()=>{ if(tok!==runTok||done){finish();return}
      let t=0,ps=-1; try{t=yt.getCurrentTime();ps=yt.getPlayerState()}catch(e){return}
      const now=Date.now(), expired=now-trig>=ICON_MS;
      if(!armed){
        if(ps===1&&expired&&t>=s.st-0.12&&t<=s.st+0.35&&(!seekAt||now-seekAt>=200)){armed=true;try{yt.setPlaybackRate(rate);yt.unMute()}catch(e){} setVid(true); if(tNote){$("status").textContent="";}}
        else if(expired&&ps===1&&t>s.st+0.35){ // overshoot / next repetition: jump back (buffered) without re-triggering the overlay
          if(!seekAt||now-seekAt>1500){ try{ if(seekTries++<2) yt.seekTo(s.st,false); else {trig=now;yt.seekTo(s.st,true);} }catch(e){} seekAt=now; } }
        else if(ps!==1&&ps!==3&&(seekAt?now-seekAt>200:now-tAll>800)&&now-lastPlay>900){ try{ yt.mute(); yt.playVideo(); }catch(e){} lastPlay=now; }
        if(!tNote&&now-tAll>900){tNote=1;$("status").textContent="영상 준비 중…";}
        if(now-tAll>25000){$("status").textContent="영상이 시작되지 않았어요. ▶를 다시 눌러 주세요.";finish()}
        return; }
      if(t>=s.et||ps===0) finish(); },50);
  };
  if(ytReady) begin();
  else{ $("status").textContent="영상 플레이어를 기다리는 중…"; w=setInterval(()=>{ if(tok!==runTok||done){clearInterval(w);return} if(ytReady){clearInterval(w);$("status").textContent="";begin()} },300); }
})}

// ---------- the 4-step engine ----------
const gap=()=>+opt.gap*1000;
async function run(tok){
  const live=()=>playing&&tok===runTok;
  preload();
  while(live()){
    skipEmpty();
    if(P.step>=4){ finishSentence(); if(!live()) return; await sleep(1400,tok); if(!live()) return; continue; }
    renderStep(); scrollIfNew();
    const st=P.step, n=cnts[st];
    if(st<2){ ytMuted(); maybePrewarm(); }
    if(st===0){
      const it=wordsList[P.u]; if(!it){P.step=1;P.u=0;P.r=0;continue}
      showCap(it,true); dbg({ev:"item",step:0,u:P.u,r:P.r,k:it.k,url:it.url});
      await speak(it.url,tok); if(!live()) return;
      await sleep(gap()*0.8,tok); if(!live()) return;
      P.r++; if(P.r>=n){P.r=0;P.u++; if(P.u>=wordsList.length){hideCap();P.step=1;P.u=0;P.r=0;await sleep(500,tok);} }
    } else if(st===1){
      hideCap();
      const items=chunkItems(cur), it=items[P.u]; dbg({ev:"item",step:1,u:P.u,r:P.r,url:it.url,text:it.text});
      await speak(it.url,tok); if(!live()) return;
      P.u++; if(P.u>=items.length){P.u=0;P.r++; await sleep(gap()*1.3,tok); if(!live()) return; if(P.r>=n){P.step=2;P.r=0;P.u=0;await sleep(300,tok);}}
      else { await sleep(220,tok); if(!live()) return; }
    } else {
      hideCap(); dbg({ev:"item",step:st,r:P.r});
      await playSeg(cur,st===2?+opt.rate:1,tok); if(!live()) return;
      P.r++; if(P.r>=n){P.step=st+1;P.r=0;P.u=0; await sleep(600,tok);} else await sleep(gap()*1.2,tok);
    }
    if(!live()) return;
  }
}
function finishSentence(){
  ytIdle();
  done.add(S[cur].n); store.set("done",[...done]); renderRows(); renderBooksOnly();
  if(opt.auto&&cur<S.length-1){ cur++; store.set("cur",cur); resetP(0); const b=S[cur].b!==S[cur-1].b; render(); $("status").textContent=b?`Book ${S[cur].b} 시작!`:""; preload(); }
  else { playing=false; renderStep(); $("status").textContent=cur>=S.length-1?"마지막 문장까지 모두 끝났어요! 🎉":"이 문장을 모두 읽었어요."; }
}
function renderBooksOnly(){const t=$("books");const sl=t.scrollLeft;render_books_keep(sl)}
function render_books_keep(sl){ $("books").innerHTML=BOOKS.map(b=>{const n=S.filter(x=>x.b===b.n),k=n.filter(x=>done.has(x.n)).length;return `<button type="button" data-b="${b.n}" aria-pressed="${b.n===S[cur].b}">Book ${b.n}<span class="c">${k===n.length?"✓":k+"/"+n.length}</span></button>`}).join(""); $("books").scrollLeft=sl; }
function start(){ if(playing) return; if(P.step>=4) resetP(0); skipEmpty(); if(P.step>=4){$("status").textContent="설정에서 횟수를 1 이상으로 해 주세요.";return}
  cancelAll(); playing=true; $("status").textContent=""; primeYt(); renderStep(); lastPos=cur+":"+P.step; scrollCard(); run(++runTok); }
function stop(){ playing=false; cancelAll(); ytIdle(); hideCap(); renderStep(); }
function go(i,keepPlaying){ const was=playing; stop(); if(i<0||i>=S.length) return; cur=i; store.set("cur",cur); resetP(0); $("status").textContent=""; render(); history.replaceState(null,"","#"+S[cur].n); if(was||keepPlaying) start(); }
function setStep(k){ const was=playing; stop(); P={step:k,r:0,u:0}; showCur=false; wordsList=sentWords(cur); render(); if(was) start(); }
$("play").onclick=()=>playing?stop():start();
$("prev").onclick=()=>go(cur-1,true);
$("next").onclick=()=>go(cur+1,true);
$("chips").addEventListener("click",e=>{const b=e.target.closest("button[data-s]");if(!b)return;const k=+b.dataset.s;if(cnts[k]===0){$("status").textContent="이 단계는 횟수가 0이에요 (⚙ 설정).";return}setStep(k);});
$("books").addEventListener("click",e=>{const b=e.target.closest("button[data-b]");if(!b)return;const i=S.findIndex(x=>x.b===+b.dataset.b);go(i,playing)});
$("rows").addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;go(+b.dataset.i,true)});

// ---------- previous / next word (chunk) inside the current step ----------
async function preview(tok){ // paused: hear the item we just jumped to, once
  if(P.step===0){const it=wordsList[P.u]; if(!it) return; showCap(it,true); dbg({ev:"item",step:0,u:P.u,r:0,k:it.k,url:it.url,preview:1}); await speak(it.url,tok);}
  else if(P.step===1){const it=chunkItems(cur)[P.u]; if(!it) return; hideCap(); dbg({ev:"item",step:1,u:P.u,r:0,url:it.url,text:it.text,preview:1}); await speak(it.url,tok);}
}
function navMove(dir){
  if(P.step>=4) return;
  const st=P.step; let np=null;
  if(st===0||st===1){
    const len=st===0?wordsList.length:S[cur].ch.length; let nu=P.u+dir;
    if(nu<0) nu=0;
    if(nu>=len){ const k=nextStepIdx(st); if(k>=0) np={step:k,r:0,u:0}; else nu=len-1; }
    if(!np) np={step:st,r:0,u:nu};
  } else { const k=dir<0?prevStepIdx():nextStepIdx(st); if(k<0) return; np={step:k,r:0,u:0}; }
  const was=playing; cancelAll(); ytIdle(); hideCap(); $("status").textContent="";
  P=np; showCur=true; renderStep();
  if(was){ lastPos=cur+":"+P.step; scrollCard(); run(++runTok); }
  else { preview(++runTok); }
}
$("uprev").onclick=()=>navMove(-1);
$("unext").onclick=()=>navMove(1);

// ---------- tap a word = hear it + see its meaning ----------
function sayWord(k,el){
  if(!W[k]) return; const was=playing; if(was) stop(); else cancelAll();
  document.querySelectorAll(".say").forEach(e=>e.classList.remove("say")); if(el) el.classList.add("say");
  const it={k,url:wUrl(k),han:W[k][0],mean:W[k][1]};
  showCap(it,false); const tok=++runTok;
  speak(it.url,tok).then(()=>{if(el) el.classList.remove("say")});
}
$("il").addEventListener("click",e=>{const c=e.target.closest(".col");if(c)sayWord(c.dataset.w,c)});
$("il").addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const c=e.target.closest(".col");if(c){e.preventDefault();sayWord(c.dataset.w,c)}});
$("ko").onclick=()=>{const c=$("card");if(c.classList.contains("hideko")){c.classList.remove("hideko");setTimeout(()=>{if(opt.hideko)c.classList.add("hideko")},2500)}};

// ---------- settings ----------
function saveOpt(){store.set("rate",opt.rate);store.set("gap",opt.gap);store.set("auto",opt.auto);store.set("dedupe",opt.dedupe);store.set("han",opt.han);store.set("hideko",opt.hideko);store.set("cnt",cnts)}
function syncSettings(){
  document.querySelectorAll(".step").forEach(s=>{s.querySelector("output").textContent=cnts[+s.dataset.k]});
  $("rate").value=opt.rate; $("gap").value=opt.gap;
  [["auto","auto"],["dedupe","dedupe"],["han","han"],["hideko","hideko"]].forEach(([id,k])=>$(id).setAttribute("aria-pressed",String(!!opt[k])));
}
document.querySelectorAll(".step").forEach(s=>s.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const k=+s.dataset.k;cnts[k]=Math.max(0,Math.min(30,cnts[k]+ +b.dataset.d));syncSettings();saveOpt();}));
["auto","dedupe","han","hideko"].forEach(id=>$(id).onclick=()=>{opt[id]=!opt[id];syncSettings();saveOpt();});
$("rate").onchange=()=>{opt.rate=$("rate").value;saveOpt()}; $("gap").onchange=()=>{opt.gap=$("gap").value;saveOpt()};
$("reset").onclick=()=>{cnts=DEF.slice();syncSettings();saveOpt()};
function openSet(){ $("modal").dataset.was=playing?"1":""; stop(); syncSettings(); $("modal").classList.add("show"); }
function closeSet(){ $("modal").classList.remove("show"); const keep=P.step; resetP(0); render(); }
$("gear").onclick=openSet; $("mclose").onclick=closeSet; $("mok").onclick=closeSet;
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeSet()});

// ---------- init ----------
(function(){ const h=location.hash.replace("#",""); if(/^\d{1,3}$/.test(h)){const i=S.findIndex(s=>s.n===+h); if(i>=0) cur=i;} })();
syncSettings(); resetP(0); render();
window.__app={get cur(){return cur},get P(){return P},get playing(){return playing}};
</script>
</html>
